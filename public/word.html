<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a Sentence - WordBridge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1B4A5E 0%, #2E7A6E 100%);
            min-height: 100vh;
            padding: 30px 40px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        /* Back button outside nav - on the left */
        .back-outer {
            margin-bottom: 12px;
        }
        
        .back-arrow {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 50px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(4px);
        }
        
        .back-arrow:hover {
            background: rgba(255,255,255,0.35);
            transform: translateX(-3px);
        }
        
        /* Navigation Bar */
        .nav {
            background: rgba(255,255,255,0.95);
            border-radius: 60px;
            padding: 12px 24px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 30px;
        }
        
        .logo {
            font-weight: 700;
            color: #1B4A5E;
            text-decoration: none;
            font-size: 1.3rem;
        }
        
        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }
        
        .nav-links a {
            text-decoration: none;
            color: #5A6B7A;
            font-weight: 500;
            font-size: 1rem;
            padding: 8px 16px;
            border-radius: 30px;
            transition: all 0.2s;
        }
        
        .nav-links a:hover {
            background: #FFB74D;
            color: #1B4A5E;
        }
        
        .profile {
            background: #FFB74D;
            color: #1B4A5E !important;
            padding: 8px 22px !important;
            border-radius: 40px;
            font-weight: 600;
        }
        
        /* Notebook Card */
        .notebook {
            background: white;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
        }
        
        /* Notebook paper lines */
        .notebook {
            background-image: repeating-linear-gradient(
                white 0px,
                white 33px,
                #E8ECEF 33px,
                #E8ECEF 34px
            );
        }
        
        h1 {
            font-size: 1.9rem;
            color: #1B4A5E;
            font-weight: 700;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .word-badge {
            display: inline-block;
            background: #FFB74D;
            color: #1B4A5E;
            font-size: 2.2rem;
            font-weight: 700;
            padding: 10px 30px;
            border-radius: 70px;
            margin-bottom: 30px;
            box-shadow: 0 5px 12px rgba(255,183,77,0.3);
        }
        
        .prompt {
            font-size: 1.1rem;
            color: #5A6B7A;
            margin-bottom: 18px;
            padding-left: 14px;
            border-left: 4px solid #FFB74D;
        }
        
        textarea {
            width: 100%;
            padding: 18px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            border: 2px solid #E2E8F0;
            background: #FAFBFC;
            border-radius: 18px;
            line-height: 1.65;
            resize: vertical;
            min-height: 180px;
            margin-bottom: 25px;
            transition: all 0.2s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #FFB74D;
            background: white;
            box-shadow: 0 0 0 3px rgba(255,183,77,0.15);
        }
        
        textarea::placeholder {
            color: #CBD5E0;
            font-style: italic;
            font-size: 0.95rem;
        }
        
        .submit-btn {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            background: #FFB74D;
            color: #1B4A5E;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .submit-btn:hover {
            background: #FFA726;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255,183,77,0.35);
        }
        
        @media (max-width: 750px) {
            body {
                padding: 20px;
            }
            .container {
                max-width: 100%;
            }
            .notebook {
                padding: 25px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .word-badge {
                font-size: 1.6rem;
                padding: 6px 22px;
            }
            .nav {
                flex-direction: column;
                gap: 15px;
            }
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Back Arrow - OUTSIDE the nav bar on the left -->
    <div class="back-outer">
        <button class="back-arrow" onclick="history.back()">←</button>
    </div>
    
    <!-- Navigation Bar (centered) -->
    <div class="nav">
        <a href="index.html" class="logo">📖 WordBridge</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="review.html">Review</a>
            <a href="tutorial.html">Tutorial</a>
            <a href="profile.html" class="profile">Profile</a>
        </div>
    </div>
    
    <!-- Notebook Card -->
    <div class="notebook">
        <h1>📝 Write & Learn</h1>
        
        <div class="word-badge" id="word"></div>
        
        <div class="prompt">
            Write a sentence using this word:
        </div>
        
        <form id="sentence-form">
            <textarea 
                id="sentence" 
                placeholder="Example: The researcher will analyse the data carefully..."
                required
            ></textarea>
            
            <button type="submit" class="submit-btn">
                Submit Sentence →
            </button>
        </form>
    </div>
    
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const word = urlParams.get('word');
    
    if (!word) {
        window.location.href = 'words.html';
    } else {
        document.getElementById('word').textContent = word;
    }

    document.getElementById('sentence-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const sentence = document.getElementById('sentence').value.trim();
        
        if (sentence) {
            window.location.href = `result.html?word=${encodeURIComponent(word)}&sentence=${encodeURIComponent(sentence)}`;
        }
    });
</script>

</body>
</html>
